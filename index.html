<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Assignment 1: Task Manager</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body class="page">
        <header>
            <div class="site-header">
                <div class="left-content"
                    <button type="button" class="hamburger">
                        <img src="assets/menu_icon.png" alt="menu icon" width="24">
                    </button>
                    <div class="search-bar">
                        <img src="assets/search_icon.png" alt="search icon" width="24">
                        <input type="text" name="q" placeholder="Quick Find">
                    </div>
                </div>
                <div class="task-counter">
                    <img src="assets/check_icon.png" alt="menu icon" width="24">
                    <p>30/5</p>
                </div>
            </div>
        </header>
        <main class="site-main">
            <aside class="navbar">
                <ul class="nav-items">
                    <li id="inbox">
                        <img src="assets/inbox_icon.png" alt="inbox icon" width="24">
                        <p class="main-text" id="current-tab">Inbox</p>
                        <p class="task-count">5</p>
                    </li>
                    <li id="today">
                        <img src="assets/calendar_icon.png" alt="calendar icon" width="24">
                        <p class="main-text">Today</p>
                        <p class="task-count">5</p>
                    </li>
                    <li id="upcoming">
                        <img src="assets/upcoming_icon.png" alt="upcoming icon" width="24">
                        <p class="main-text">Upcoming</p>
                    </li>
                </ul>
            </aside>
            <section class="main-content">
                <h1>Inbox</h1>
                <ul class="task-list">
                    <li>
                        <label class="task">
                            <input type="checkbox" name="tasks" id="task-1" value="Call Mom">Call Mom
                        </label>
                    </li>
                </ul>
            </section>
        </main>
    </body>
</html>
